[project]
name = "the-factory"
version = "2.0.0"
description = "Agent experimentation platform for THE_FACTORY portfolio"
requires-python = ">=3.11"

[project.optional-dependencies]
evals = [
    "deepeval>=2.0.0",
    "pytest>=8.0",
]
experiments = [
    "inspect-ai>=0.3",
    "pyyaml>=6.0",
]
observability = [
    "langfuse>=2.0",
]
all = [
    "the-factory[evals,experiments,observability]",
]

[tool.pytest.ini_options]
testpaths = ["evals"]
# Canonical eval command: .venv/bin/python -m pytest evals/ -v
# addopts disables ambient plugins that can break deterministic runs
addopts = "-p no:randomly -p no:xdist -p no:repeat -p no:rerunfailures --override-ini=asyncio_mode=auto"
markers = [
    "convention: deterministic code convention checks",
    "flow: LLM-as-judge flow compliance checks",
    "handoff: handoff schema validation checks",
    "skill: skill triggering checks",
    "mining: eval cases derived from conversation mining",
    "behavioral: checks actual agent behavior from session transcripts",
]
