[project]
name = "als-reader"
version = "0.1.0"
description = "Ableton Live Set (.als) parser, analyzer, and editor for AI agent pipelines"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["ableton", "als", "parser", "music", "daw", "mcp", "ai", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
mcp = ["fastmcp>=2.0.0"]

[project.scripts]
als-reader = "als_reader.__main__:main"

[project.urls]
Repository = "https://github.com/yourusername/als-reader"
Issues = "https://github.com/yourusername/als-reader/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["als_reader"]
